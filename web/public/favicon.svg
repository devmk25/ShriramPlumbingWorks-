<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Subtle Tech Circuit Ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 12"/>
  
  <!-- Stylized Auspicious Golden Bow (श्रीराम धनुष्य) -->
  <path d="M 140 310 C 120 230, 160 140, 256 120 C 352 140, 392 230, 372 310" 
        fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
        
  <!-- Precision Core Cutting Diamond Ring (Cutter Disc) -->
  <circle cx="256" cy="230" r="95" fill="none" stroke="url(#blueGrad)" stroke-width="14"/>
  <!-- Cutter Teeth -->
  <g stroke="url(#blueGrad)" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="135"/>
    <line x1="256" y1="325" x2="256" y2="340"/>
    <line x1="146" y1="230" x2="161" y2="230"/>
    <line x1="351" y1="230" x2="366" y2="230"/>
    <line x1="178" y1="152" x2="189" y2="163"/>
    <line x1="323" y1="297" x2="334" y2="308"/>
    <line x1="334" y1="152" x2="323" y2="163"/>
    <line x1="189" y1="297" x2="178" y2="308"/>
  </g>

  <!-- Flowing Plumbing Pipe Intersecting Central Water Droplet -->
  <path d="M 256 150 C 256 150, 205 220, 205 255 C 205 283, 228 305, 256 305 C 284 305, 307 283, 307 255 C 307 220, 256 150, 256 150 Z" 
        fill="url(#emeraldGrad)" filter="url(#glow)"/>

  <!-- Compact Arrowhead / Valve Pointer -->
  <polygon points="256,90 244,115 268,115" fill="url(#goldGrad)"/>

  <!-- Lower Foundation Layer (Dhumus Compactor Symbol) -->
  <path d="M 160 360 L 352 360" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 185 375 L 327 375" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215 390 L 297 390" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="256" y="440" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
    श्रीराम प्लंबिंग वर्क्स
  </text>
  <text x="256" y="468" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="3">
    MIRAJWADI • CIVIL &amp; MACHINE
  </text>
</svg>
