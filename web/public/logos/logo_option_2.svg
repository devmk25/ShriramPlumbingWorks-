<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="sapphireBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="emeraldMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean App Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgLightGrad)" filter="url(#softShadow)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Precision Engineering Hexagon -->
  <polygon points="256,70 395,150 395,310 256,390 117,310 117,150" 
           fill="none" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Modern Pipeline 'S' Monogram (Shriram) -->
  <path d="M 330 145 C 330 145, 230 135, 195 170 C 160 205, 200 240, 256 245 C 315 250, 345 285, 310 325 C 275 365, 175 350, 175 350" 
        fill="none" stroke="url(#sapphireBlue)" stroke-width="24" stroke-linecap="round"/>

  <!-- Interlocking 'P' (Plumbing) Pipe Coupler -->
  <path d="M 220 160 L 220 340 M 220 160 C 270 160, 310 175, 310 215 C 310 255, 260 265, 220 265" 
        fill="none" stroke="url(#emeraldMint)" stroke-width="16" stroke-linecap="round"/>

  <!-- Core Cutter Diamond Disc Center -->
  <circle cx="256" cy="240" r="28" fill="#FFFFFF" stroke="url(#sapphireBlue)" stroke-width="8"/>
  <circle cx="256" cy="240" r="10" fill="url(#emeraldMint)"/>

  <!-- Dynamic Flow Valve Accents -->
  <circle cx="175" cy="350" r="14" fill="url(#sapphireBlue)"/>
  <circle cx="330" cy="145" r="14" fill="url(#sapphireBlue)"/>

  <!-- Labels -->
  <text x="256" y="432" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="2">
    SHRIRAM
  </text>
  <text x="256" y="460" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="4">
    PLUMBING &amp; CIVIL WORKS
  </text>
</svg>
